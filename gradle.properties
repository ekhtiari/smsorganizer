org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AGP 8.7 is verified through compileSdk 35. The app already targets 36.
android.suppressUnsupportedCompileSdk=36
# material3 1.5 Expressive pulls Compose runtime 1.9, whose lint checks need
# Lint 8.8.2. This upgrades lint only; AGP stays on 8.7 (Gradle 8.9).
android.experimental.lint.version=8.8.2
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
